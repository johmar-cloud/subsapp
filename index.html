<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            },
            backgroundImage: {
              'radar-grid': "linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(30,64,175,0.04) 100%)",
            },
            boxShadow: {
              glow: "0 20px 45px -20px rgba(99,102,241,0.55)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.12), transparent 45%),
          radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.08), transparent 50%),
          #020617;
        font-family: "Plus Jakarta Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e2e8f0;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
